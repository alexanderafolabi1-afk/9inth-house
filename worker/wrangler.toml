# Must match the Worker this repo actually deploys to. The account holds exactly
# one Worker, "9inth-house-engine", and the Git integration has been updating it
# on every push, overriding the name that used to sit here. Left mismatched, the
# trap is a local "wrangler deploy": it would read this file literally and create
# a second, separate Worker, which can then take the Route below away from the
# real one. Matching it means every route to deploy, from CI or from a laptop,
# lands on the same Worker.
name = "9inth-house-engine"
main = "src/index.js"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

# The .workers.dev address is the only one this Worker answers on. desk.html
# calls it directly, cross-origin, and CORS (allowedOrigins/corsHeaders in
# worker/src/social/api.js, DESK_ORIGIN below) is what authorizes that call,
# not same-origin cookies: login hands back a signed bearer token in the
# response body (see mintSession/requireSession), so there is nothing for a
# same-site cookie policy to need answering on 9thpoint.com's own zone for.
#
# A `[[routes]] pattern = "9thpoint.com/api/*"` binding used to live here,
# left over from an earlier, abandoned same-site-cookie design. It was never
# used by desk.html (see worker/README.md's Authentication section) and it
# actively broke this Worker's CORS: with that Route bound, a request whose
# Origin header is exactly "https://9thpoint.com" (the apex, no www, the
# canonical origin the CNAME file and the installed PWA actually use) got
# Access-Control-Allow-Origin echoing this Worker's own serving address
# instead of the real Origin, which every browser's CORS check then rejects,
# surfacing as a fetch() that throws rather than a login that merely fails.
# It reproduced identically under `wrangler dev` against this exact
# wrangler.toml, and it went away the moment the Route did. Do not add a
# Route back here without re-running scripts/check-cors.mjs against it first.
workers_dev = true

# ============================================================================
# LOGIN RATE LIMITING
# ============================================================================
# Failed login attempts and lockouts are counted here, keyed by IP. Unlike the
# D1 block below, this one is not optional once login is in use: with no
# LOGIN_ATTEMPTS binding, POST /api/auth/login refuses every request rather
# than allow unlimited guesses, so the admin cannot be logged into at all
# until this is connected.
#
# Connected.
[[kv_namespaces]]
binding = "LOGIN_ATTEMPTS"
id = "9a1f764305b74398a0bcdc109586e713"

# ============================================================================
# PASSWORD RESET WINDOW
# ============================================================================
# While this timestamp is in the future, the desk shows "Create your password"
# even though a password is already stored, and setting one writes over it.
# Outside the window everything behaves normally and a stored password cannot be
# overwritten.
#
# This exists because the password hash lives in KV with no route to it from the
# desk, so an owner who does not know it is locked out of their own house with no
# way back that does not involve the Cloudflare dashboard. Arming it needs a
# commit and a deploy, which is the proof of ownership; there is deliberately no
# endpoint or button that can open it, because those could be reached by whoever
# found the address first.
#
# WHILE IT IS OPEN, THE FIRST PERSON TO REACH THE SCREEN CLAIMS THE DESK. Set the
# password promptly, then close the window by deleting the line below or setting
# a past date. It expires by itself regardless, so a forgotten line cannot leave
# the door open indefinitely.
[vars]
PASSWORD_RESET_UNTIL = "2026-08-30T14:00:00Z"

# DESK_ORIGIN, which used to live here, is gone. It was a single point of
# failure this Worker could not see fail: whether it was absent, stale from
# an old deploy, or set by hand on the Cloudflare dashboard to something
# that no longer matched this file, every one of those looked identical
# from the outside, and every one of them meant desk.html got no
# Access-Control-Allow-Origin header back and every fetch failed before it
# ever reached a route, for a right password and a wrong one alike. It
# happened more than once, including after this exact variable was
# "pinned" here the first time, which is what taught the lesson that a
# value the admin's own real origin depends on cannot live in a variable
# at all, however carefully it is committed.
#
# The two origins the admin has ever really lived at now ship inside the
# Worker's own code (KNOWN_DESK_ORIGINS in worker/src/origins.js), so
# accepting them can never again depend on a deploy syncing a separate
# setting. Anything beyond that is additive only, set from the desk's own
# Settings screen and held in KV (worker/src/origins.js again), the same
# way the password hash, the session secret and the Anthropic key already
# are. If a DESK_ORIGIN env var is ever set here or on the dashboard again,
# the code now only ever adds it to the guaranteed list, never replaces
# the list with it, so the failure mode this comment describes cannot
# recur even by accident.

# Four shifts a day, matching the retired GitHub Actions schedule exactly.
# All times UTC. Cloudflare Cron Triggers are always UTC, so no conversion
# from the old workflow's cron lines is needed.
[triggers]
crons = [
  "30 5 * * *",   # 05:30 UTC, Dawn shift (Night Press publishes here, and the social batch is written)
  "30 11 * * *",  # 11:30 UTC, Midday shift
  "30 17 * * *",  # 17:30 UTC, Evening shift (metrics are read here)
  "30 23 * * *"   # 23:30 UTC, Night shift
]

# ============================================================================
# STORAGE FOR THE DISTRIBUTION ENGINE
# ============================================================================
# The queue, the venture registry, the metrics and the notification subscriptions
# all live in a D1 database. It is commented out rather than filled in with a
# placeholder on purpose: this Worker deploys automatically from main, and a
# binding pointing at a database that does not exist yet fails the deploy and
# stops the autopilot, the Night Press and the journal from shipping with it.
#
# Connected. The database was created on the account on 30 Aug 2026 and the id
# below is the real one it was issued, not a placeholder, so this deploys rather
# than failing the build. The tables are created on the next shift, and the
# Prepare storage button in the desk Settings does it immediately.
#
# The engine stays defensive about this regardless: hasStore(env) still gates
# every path that touches the database, so removing this block degrades the
# engine to "storage is not configured" instead of breaking the autopilot, the
# Night Press or the journal.
[[d1_databases]]
binding = "DB"
database_name = "ninth-house-social"
database_id = "520abee5-c4e7-435a-b265-2461a9599ed4"
