name = "ninth-house-autopilot"
main = "src/index.js"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

# Kept on alongside the Route below, on purpose: the .workers.dev address stays
# reachable for curl (the Author Desk trigger, manual /social calls with a
# bearer token) even once the admin itself moves to the Route.
workers_dev = true

# ============================================================================
# SAME-SITE ROUTE FOR THE SESSION COOKIE
# ============================================================================
# desk.html lives on 9thpoint.com. For its login to set an HttpOnly,
# SameSite=Strict cookie that the browser will actually send back, the Worker
# has to answer on a hostname the browser considers the same site as
# 9thpoint.com; a SameSite=Strict cookie is never sent on a cross-site fetch,
# so leaving the Worker on only the .workers.dev domain would make the whole
# login silently useless. Commented out, like the D1 block below, because an
# uncommitted zone_name (wrong account, zone not actually on Cloudflare) fails
# the deploy outright and would take the cron down with it.
#
# To connect it, once, and only after confirming 9thpoint.com's DNS is on the
# same Cloudflare account used for `wrangler login`:
#
#   1. Delete the # from the three lines below.
#   2. Commit and push (this Worker deploys automatically from main).
#
# [[routes]]
# pattern = "9thpoint.com/api/*"
# zone_name = "9thpoint.com"

# ============================================================================
# LOGIN RATE LIMITING
# ============================================================================
# Failed login attempts and lockouts are counted here, keyed by IP. Unlike the
# D1 block below, this one is not optional once login is in use: with no
# LOGIN_ATTEMPTS binding, POST /api/auth/login refuses every request rather
# than allow unlimited guesses, so the admin cannot be logged into at all
# until this is connected.
#
# To connect it, once:
#
#   1. cd worker && npx wrangler kv namespace create LOGIN_ATTEMPTS
#   2. Copy the id it prints into the block below.
#   3. Delete the # from the three lines below.
#   4. Commit and push.
#
# [[kv_namespaces]]
# binding = "LOGIN_ATTEMPTS"
# id = "paste-the-id-here"

# Four shifts a day, matching the retired GitHub Actions schedule exactly.
# All times UTC. Cloudflare Cron Triggers are always UTC, so no conversion
# from the old workflow's cron lines is needed.
[triggers]
crons = [
  "30 5 * * *",   # 05:30 UTC, Dawn shift (Night Press publishes here, and the social batch is written)
  "30 11 * * *",  # 11:30 UTC, Midday shift
  "30 17 * * *",  # 17:30 UTC, Evening shift (metrics are read here)
  "30 23 * * *"   # 23:30 UTC, Night shift
]

# ============================================================================
# STORAGE FOR THE DISTRIBUTION ENGINE
# ============================================================================
# The queue, the venture registry, the metrics and the notification subscriptions
# all live in a D1 database. It is commented out rather than filled in with a
# placeholder on purpose: this Worker deploys automatically from main, and a
# binding pointing at a database that does not exist yet fails the deploy and
# stops the autopilot, the Night Press and the journal from shipping with it.
#
# Until it is connected the engine simply says storage is not configured, and
# everything else runs exactly as before.
#
# To connect it, once:
#
#   1. cd worker && npx wrangler d1 create ninth-house-social
#   2. Copy the database_id it prints into the block below.
#   3. Delete the # from the four lines below.
#   4. Commit and push. The deploy creates the tables on the next shift, or you
#      can use Prepare storage in the desk Settings to do it immediately.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "ninth-house-social"
# database_id = "paste-the-id-here"
