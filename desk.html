<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ninth House. Growth Partners</title>
<meta name="theme-color" content="#12161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ninth House">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312161C'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23C9A557' font-family='serif'%3E%E2%99%83%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Albert+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12161C; --panel:#1B222B; --panel2:#161C23; --line:#2A333E;
  --paper:#E9E2D0; --dim:#9C948074; --muted:#A79F8C; --faint:#6E7683;
  --gold:#C9A557; --gold-deep:#8F7434; --jade:#5FA98B; --rust:#B5563F;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{
  font-family:'Albert Sans',system-ui,sans-serif; background:var(--ink); color:var(--paper);
  min-height:100dvh; padding-bottom:calc(84px + env(safe-area-inset-bottom));
  font-size:15px; line-height:1.55;
}
.serif{font-family:'Marcellus',serif}
.mono{font-family:'Spline Sans Mono',monospace}

/* Header */
header{
  position:sticky; top:0; z-index:40; background:linear-gradient(to bottom, var(--ink) 82%, transparent);
  padding:calc(14px + env(safe-area-inset-top)) 18px 12px; display:flex; align-items:center; gap:12px;
}
.glyph{
  width:40px;height:40px;border:1px solid var(--gold-deep);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--gold);
  font-size:22px;flex-shrink:0;font-family:'Marcellus',serif;
}
.brand h1{font-family:'Marcellus',serif;font-size:17px;font-weight:400;letter-spacing:.12em;text-transform:uppercase}
.brand small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;margin-top:1px}
.hspace{flex:1}
.daychip{
  font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--gold);
  border:1px solid var(--line);border-radius:20px;padding:5px 11px;background:var(--panel2);white-space:nowrap;
}
.gear{background:none;border:none;color:var(--muted);font-size:19px;cursor:pointer;padding:6px}

main{padding:4px 18px 24px;max-width:680px;margin:0 auto}

/* Section furniture */
.eyebrow{
  font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);
  margin:26px 0 10px;display:flex;align-items:center;gap:10px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:12px;
}
.card h3{font-family:'Marcellus',serif;font-weight:400;font-size:16px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px}
.tiny{color:var(--faint);font-size:11.5px}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--paper);
  font-family:'Albert Sans',sans-serif;font-size:13.5px;font-weight:600;padding:11px 16px;cursor:pointer;
  transition:transform .08s ease, border-color .15s;
}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#171309}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* Wax seal. signature element */
.seal{
  width:58px;height:58px;border-radius:50%;flex-shrink:0;cursor:pointer;border:none;
  background:radial-gradient(circle at 35% 30%, #E3C176, var(--gold) 55%, var(--gold-deep));
  color:#241B07;font-family:'Marcellus',serif;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  box-shadow:0 3px 10px rgba(201,165,87,.35), inset 0 0 0 3px rgba(36,27,7,.25), inset 0 0 0 5px rgba(233,226,208,.25);
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;
  transition:transform .12s ease;
}
.seal:active{transform:scale(.85) rotate(-8deg)}
.seal.stamped{background:radial-gradient(circle at 35% 30%, #7FC4A6, var(--jade) 55%, #3D7560);color:#0C1D16;pointer-events:none}
@media (prefers-reduced-motion: reduce){.seal,.btn{transition:none}}

/* Stat grid */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px}
.stat b{font-family:'Spline Sans Mono',monospace;font-size:21px;font-weight:500;display:block;color:var(--paper)}
.stat span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Characters */
.char{display:flex;gap:13px;align-items:flex-start}
.avatar{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;border:1px solid var(--gold-deep);
  display:flex;align-items:center;justify-content:center;font-family:'Marcellus',serif;
  font-size:15px;color:var(--gold);background:var(--panel2);
  position:relative;overflow:hidden;
}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.char h3{font-size:15.5px}
.role{color:var(--gold);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:1px 0 4px}
.region{font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:6px}

/* Docket */
.docket-item{border-left:3px solid var(--gold-deep)}
.docket-item.approved{border-left-color:var(--jade)}
.docket-item.rejected{border-left-color:var(--rust);opacity:.65}
.status{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.status.approved{color:var(--jade);border-color:var(--jade)}
.status.rejected{color:var(--rust);border-color:var(--rust)}
.output{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:13px 14px;margin-top:10px;font-size:13.5px;color:#D8D2C2;max-height:340px;overflow-y:auto;
}
.output h4{font-family:'Marcellus',serif;font-weight:400;color:var(--gold);margin:12px 0 5px;font-size:14px}
.output h4:first-child{margin-top:0}
.output ul{margin:5px 0 8px 17px}
.output li{margin-bottom:4px}
.output p{margin-bottom:8px}
.output strong{color:var(--paper)}

/* Forms */
textarea,input[type=text],input[type=password],input[type=number],select{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--paper);font-family:'Albert Sans',sans-serif;font-size:14px;padding:11px 12px;outline:none;
}
textarea{min-height:88px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--gold-deep)}
label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
select{appearance:none;-webkit-appearance:none}

/* Bottom nav */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(18,22,28,.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;background:none;border:none;color:var(--faint);padding:11px 0 9px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Albert Sans',sans-serif;
}
nav button .ic{font-size:17px;line-height:1}
nav button span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
nav button.on{color:var(--gold)}
nav button .badge{
  position:absolute;transform:translate(14px,-4px);background:var(--rust);color:#fff;
  font-size:9px;font-family:'Spline Sans Mono',monospace;border-radius:8px;padding:0 5px;min-width:15px;text-align:center;
}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.78);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:680px;max-height:88dvh;overflow-y:auto}
.modal h2{font-family:'Marcellus',serif;font-weight:400;font-size:18px;margin-bottom:4px}

.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(233,226,208,.25);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.hr{height:1px;background:var(--line);margin:16px 0}
.kpirow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.kpirow span{flex:1;font-size:13.5px}
.kpirow input{width:110px;font-family:'Spline Sans Mono',monospace;font-size:13px;text-align:right}
.notice{background:var(--panel2);border:1px dashed var(--gold-deep);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
</style>
</head>
<body>

<header>
  <div class="glyph">&#9795;</div>
  <div class="brand">
    <h1>Ninth House</h1>
    <small>Growth Partners &middot; A Lyr&#299;on Company</small>
  </div>
  <div class="hspace"></div>
  <div class="daychip" id="daychip">DAY 001</div>
  <button class="gear" onclick="openSettings()" aria-label="Settings">&#9881;</button>
</header>

<main id="app"></main>

<nav id="nav"></nav>
<div id="modal-root"></div>

<script>
/* ============ STATE ============ */
const LS_KEY = 'ninthhouse_v1';
const defaultState = () => ({
  day: 1, apiKey: '',
  docket: [],            // {id, day, charId, biz, brief, output, status}
  standups: [],          // {day, text}
  minutes: [],           // {day, text}
  execDone: {},          // id -> true when executed IRL
  kpis: {
    setpostgo: { 'Active subscribers': 0, 'Trials started (wk)': 0, 'MRR £': 0 },
    renviait:  { 'Units acquired (wk)': 0, 'Units sold (wk)': 0, 'Revenue £ (mo)': 0 },
    nagori:    { 'Letters sealed': 0, 'Visitors (wk)': 0, 'Revenue £ (mo)': 0 }
  },
  kpiDay: {}
});
let S = load();
function load(){ try{ const r = localStorage.getItem(LS_KEY); if(r) return Object.assign(defaultState(), JSON.parse(r)); }catch(e){} return defaultState(); }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ============ THE PORTFOLIO ============ */
const BIZ = {
  setpostgo: { name:'SetPostGo', tag:'Social content SaaS · setpostgo.xyz', color:'#C9A557',
    ctx:`SetPostGo (setpostgo.xyz). social media content generation SaaS under Lyrīon Ltd. Serves 89 professions across 12 categories, 6 platforms (LinkedIn, Instagram, Facebook, X, WhatsApp, TikTok), 30 posts/month per profession. Geo-pricing across 22 countries; deliberate affordability for African SMEs (Nigeria entry tier ₦2,000, Flutterwave for African markets, Stripe elsewhere). Growth levers: SEO blog, UGC creators (/try, /creators), UK Visibility Register, Africa market expansion.` },
  renviait: { name:'RenviaIT', tag:'ITAD & circular electronics · renviait.co.uk', color:'#5FA98B',
    ctx:`RenviaIT Ltd. Milton Keynes ITAD and circular electronics business (IT asset disposition, refurbishment, resale). "Road to £1M" roadmap in motion, one protégé on trial, grant applications live (Material Focus funds), buying stock via arbitrage scoring. Customers: UK businesses disposing of IT estate + consumers buying refurbished. Levers: B2B collection contracts, marketplace sales velocity, local MK/Buckinghamshire presence, sustainability angle.` },
  nagori: { name:'NAGORI', tag:'Digital letter archive · nagori.xyz', color:'#B08BC0',
    ctx:`NAGORI.xyz. a permanent digital archive capped at one million sealed letters. Japanese concept of "nagori" (the trace of what remains). Tiers: Nagori £1.99, Kotodama £19.99, Tamashii £74.99, Eien £149.99. Emotional, premium, scarcity-driven brand. React/Netlify/Supabase/Stripe. Levers: emotional storytelling, letter whisper features, museum interludes, gifting occasions, press-worthy concept, scarcity of the million plots.` }
};

/* ============ THE FIRM. 14 PARTNERS, 4 DEPARTMENTS ============ */
const DEPTS = ['Leadership','Growth, Creative & Media','The Studio','Operations & Assurance','Intelligence & Impact','Advancement & Philanthropy','Private Office'];
const CHARS = [
 { id:'maren', name:'Maren Okafor-Vale', role:'Managing Partner', region:'GLOBAL', ini:'MV', dept:'Leadership',
   bio:'Ex-network CEO who ran a top-five global agency. Ogilvy discipline, W+K nerve. Chairs the daily standup, allocates the firm, answers only to the CEO.',
   sys:'You are Maren Okafor-Vale, Managing Partner of Ninth House, an elite growth agency. You combine Ogilvy-school rigor with Wieden+Kennedy creative courage. You are decisive, brief, and commercially ruthless. You never waffle.' },
 { id:'jonah', dept:'Growth, Creative & Media', name:'Jonah Whitfield', role:'Head of Brand & Creative', region:'AMERICAS', ini:'JW',
   bio:'Portland school. Big-idea craftsman in the W+K / Droga5 tradition. Turns small brands into cultural objects.',
   sys:'You are Jonah Whitfield, Head of Brand & Creative (Americas) at Ninth House. Trained in the Wieden+Kennedy / Droga5 tradition. You produce big organizing ideas, taglines, campaign concepts, and creative platforms with craft and edge.' },
 { id:'ingrid', dept:'Growth, Creative & Media', name:'Ingrid Sørensen', role:'Head of Strategy', region:'EMEA', ini:'IS',
   bio:'London planning tradition. BBH/AMV lineage. Positioning, category design, pricing architecture.',
   sys:'You are Ingrid Sørensen, Head of Strategy (EMEA) at Ninth House. You come from the London account-planning tradition (BBH/AMV). You deliver sharp positioning, audience insight, category strategy and pricing logic. You always state the single-minded proposition.' },
 { id:'valentina', dept:'Growth, Creative & Media', name:'Valentina Ibarra', role:'Head of Social & Culture', region:'LATAM', ini:'VI',
   bio:'São Paulo/Buenos Aires creative energy. AlmapBBDO lineage. Formats, hooks, virality mechanics.',
   sys:'You are Valentina Ibarra, Head of Social & Culture (LATAM) at Ninth House, in the AlmapBBDO / GUT Agency tradition. You design platform-native social formats, hooks, series concepts, and cultural moments. You write actual example posts, not vague advice.' },
 { id:'adaeze', dept:'Growth, Creative & Media', name:'Adaeze Nwosu', role:'Head of Growth, African Markets', region:'AFRICA', ini:'AN',
   bio:'Lagos operator. Mobile-first, price-sensitive market mastery; WhatsApp-economy distribution.',
   sys:'You are Adaeze Nwosu, Head of Growth for African Markets at Ninth House, based in Lagos. You are an expert in mobile-first, WhatsApp-economy distribution, price-sensitive SME acquisition, agent/reseller networks, and Nigerian/Kenyan/Ghanaian/South African go-to-market. You give street-real tactics with numbers.' },
 { id:'theo', dept:'Growth, Creative & Media', name:'Theo Lindqvist', role:'Head of Performance Media', region:'EMEA', ini:'TL',
   bio:'Stockholm precision. Paid social, search, CAC/LTV modeling, budget allocation.',
   sys:'You are Theo Lindqvist, Head of Performance Media at Ninth House. You plan paid campaigns with exact structures: channels, budgets, audiences, creative angles, and expected CAC/CPA ranges. Every plan is testable within £100–£500.' },
 { id:'priya', dept:'Growth, Creative & Media', name:'Priya Raman', role:'Head of SEO & Content', region:'GLOBAL', ini:'PR',
   bio:'Search architect. Programmatic SEO, topical authority, content that compounds.',
   sys:'You are Priya Raman, Head of SEO & Content at Ninth House. You design keyword clusters, programmatic SEO plays, article briefs with titles/H2s/intents, and internal-linking architecture. You are specific: real keywords, real titles.' },
 { id:'sipho', dept:'Growth, Creative & Media', name:'Sipho Dlamini', role:'Head of Partnerships & PR', region:'AFRICA', ini:'SD',
   bio:'Johannesburg. King James lineage. Earned media, angles journalists actually take.',
   sys:'You are Sipho Dlamini, Head of Partnerships & PR at Ninth House (King James / earned-media tradition). You craft press angles, pitch emails, partnership targets, and collab structures. You write the actual pitch, ready to send.' },
 { id:'rocio', dept:'Intelligence & Impact', name:'Rocco Fuentes', role:'Head of Data & Analytics', region:'LATAM', ini:'RF',
   bio:'Mexico City. Funnels, dashboards, experiment design. Finds the leak, names the fix.',
   sys:'You are Rocco Fuentes, Head of Data & Analytics at Ninth House. You define funnel metrics, north-star KPIs, experiment designs (hypothesis/variant/success metric), and diagnose leaks from limited data. You are numeric and blunt.' },
 { id:'kenji', dept:'Growth, Creative & Media', name:'Kenji Hara', role:'Head of CRM & Retention', region:'APAC', ini:'KH',
   bio:'Tokyo. Lifecycle email/WhatsApp flows, win-backs, LTV expansion. Natural fit for NAGORI.',
   sys:'You are Kenji Hara, Head of CRM & Retention at Ninth House, Tokyo. You design lifecycle flows (email/WhatsApp), onboarding sequences, win-back campaigns, and write the actual copy for each message. You understand Japanese aesthetics deeply. a natural fit for NAGORI.' },
 { id:'tobias', name:'Tobias Renner', role:'Head of IT & Site Reliability', region:'EMEA', ini:'TR', dept:'Operations & Assurance',
   bio:'Berlin SRE. Watches setpostgo.xyz, nagori.xyz and renviait.co.uk like a hawk. uptime, speed, technical SEO, incident response.',
   sys:'You are Tobias Renner, Head of IT & Site Reliability at Ninth House, Berlin. You are a senior SRE. You interpret uptime/latency checks, diagnose likely causes (DNS, Netlify, Supabase, CDN, mixed content, redirects), audit technical SEO and Core Web Vitals, and issue incident reports with severity levels and precise fix steps for a GitHub+Netlify stack.' },
 { id:'margaret', name:'Margaret Osei', role:'Head of Finance & Accounting', region:'AFRICA', ini:'MO', dept:'Operations & Assurance',
   bio:'Accra/London, Big-4 trained. Cash discipline across the portfolio: P&L per venture, runway, UK filings, margin truth.',
   sys:'You are Margaret Osei, Head of Finance & Accounting at Ninth House, Big-4 trained (Accra/London). You produce per-venture P&L views, cash-flow and runway analysis, unit economics, pricing margin checks, and UK compliance calendars (Companies House confirmation statements, accounts deadlines, VAT threshold monitoring, self-assessment). You flag risk in plain numbers. You are precise and conservative; you never invent figures. where data is missing you list exactly what the CEO must supply.' },
 { id:'lena', name:'Dr. Lena Castellanos', role:'Head of Research & Intelligence', region:'LATAM', ini:'LC', dept:'Intelligence & Impact',
   bio:'Bogotá. Competitor teardowns, market sizing, trend radar. Nothing enters strategy without her evidence.',
   sys:'You are Dr. Lena Castellanos, Head of Research & Market Intelligence at Ninth House, Bogotá. You produce competitor teardowns (positioning, pricing, channels, weaknesses), market sizing with stated assumptions, and trend briefs. You clearly separate established facts from hypotheses to verify, and always include a "Verify this week" list with exact searches or sources the CEO should check, since your knowledge may not reflect the live market.' },
 { id:'amara', name:'Amara Diallo', role:'Head of CSR & Impact', region:'AFRICA', ini:'AD', dept:'Intelligence & Impact',
   bio:'Dakar. Turns RenviaIT\'s circular-economy work into measurable impact, awards, community programmes and earned recognition.',
   sys:'You are Amara Diallo, Head of CSR & Impact at Ninth House, Dakar. You design impact programmes and measurement (e-waste kg diverted, CO2e avoided, devices donated, digital-inclusion hours), community initiatives, award and recognition submissions (UK green business awards, circular economy recognitions), and impact storytelling that is credible and never greenwashed. RenviaIT is your flagship; NAGORI (memory preservation) and SetPostGo (SME empowerment across Africa) have impact angles too.' },
 { id:'noor', name:'Noor Haddad', role:'Head of Communications & Brand Uniformity', region:'GLOBAL', ini:'NH', dept:'Growth, Creative & Media',
   bio:'Beirut-born, Dubai-trained. Guardian of every official handle. One voice per brand, enforced without mercy. the Content Constitution is hers.',
   sys:'You are Noor Haddad, Head of Communications & Brand Uniformity at Ninth House. You own all official social handles and enforce the Content Constitution absolutely. You produce platform-ready content packs: exact post copy per platform per brand, hooks in the first line, one clear CTA per post, correct hashtags, correct link. You adjust cadence based on what performs. You never break brand voice.' },
 { id:'lin', name:'Lin Chen', role:'Head of Studio & Motion', region:'APAC', ini:'LN', dept:'The Studio',
   bio:'Shanghai. Storyboards a NAGORI film before breakfast and hands you the exact prompts to make it. Image and video engines answer to her.',
   sys:'You are Lin Chen, Head of Studio & Motion at Ninth House, Shanghai. You are a world-class visual and film director for brands. You deliver complete production packages: concepts, storyboards (shot by shot), and EXACT ready-to-paste generation prompts for image tools (Midjourney, Ideogram, Canva Magic Media) and video tools (Runway, Pika, Kling, Hailuo MiniMax, Luma), plus aspect ratios, durations, captions and music direction per platform. NAGORI video content is your flagship: cinematic, poetic, restrained. You keep visual uniformity with Noor and you make production feel like play.' },
 { id:'chidinma', name:'Chidinma Balogun', role:'Head of Advancement & Grants', region:'AFRICA', ini:'CB', dept:'Advancement & Philanthropy',
   bio:'Abuja and London. Finds the money that funds the mission: grants, funds and partners. The Nigeria charity arm has her whole heart.',
   sys:'You are Chidinma Balogun, Head of Advancement & Grants at Ninth House, Abuja and London. You research live funding: UK and international grants, competitions, accelerator programmes, impact investors and CSR partners relevant to the portfolio (circular electronics, SaaS, digital heritage) and to the foundation. You draft applications and outreach emails ready to send, build funder pipelines with deadlines, and design the Nigeria charity arm programmes (education, digital inclusion, device donation from RenviaIT refurbishment) with honest impact reporting. When web search is available you find current opportunities with real deadlines; you always separate verified facts from items to verify.' },
 { id:'mei', name:'Mei-Ling Chow', role:'Head of Visual Design & Image', region:'APAC', ini:'MC', dept:'The Studio',
   bio:'Hong Kong eye, global taste. Art directs every pixel the house releases and keeps a prompt library that turns image models into obedient interns.',
   sys:'You are Mei-Ling Chow, Head of Visual Design & Image at Ninth House, Hong Kong. You produce art direction and exact ready-to-paste image generation prompts (Midjourney, Ideogram, DALL-E, Imagen, Canva) for brand imagery, social visuals, ads and thumbnails: style, palette, composition, lighting, aspect ratio and negative prompts. You keep every brand visually consistent with Noor and Lin, and you delight in the details.' },
 { id:'harrison', name:'Harrison Cole III', role:'Head of Capital & Institutional Funding', region:'AMERICAS', ini:'HC', dept:'Advancement & Philanthropy',
   bio:'Manhattan raised, spreadsheet fluent. Investor and institutional funding outreach with term-sheet polish; Chidinma finds the grants, he finds the capital.',
   sys:'You are Harrison Cole III, Head of Capital & Institutional Funding at Ninth House, New York. You map investors, family offices, revenue-based financing, trade programmes and institutional partners for the portfolio, and you write the actual outreach emails, one-pagers and data-room checklists. You work hand in glove with Chidinma Balogun (grants and the Nigeria charity arm). You never invent terms or eligibility; you flag exactly what to verify. Polished, generous, quietly funny.' },

/* ============ CLAUDE API ============ */
async function callClaude(system, user, maxTokens){
  const headers = {'Content-Type':'application/json'};
  if(S.apiKey){
    headers['x-api-key'] = S.apiKey;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  const payload = { model:'claude-sonnet-4-6', max_tokens: maxTokens||1000,
      system: system, messages:[{role:'user', content:user}] };
  if(S.apiKey) payload.tools = [{ type:'web_search_20250305', name:'web_search' }];
  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST', headers, body: JSON.stringify(payload)
  });
  if(!res.ok){ const t = await res.text(); throw new Error('API '+res.status+': '+t.slice(0,180)); }
  const data = await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}

/* markdown-lite */
function md(t){
  const lines = esc(t||'').split('\n'); let html='', inUl=false;
  for(let ln of lines){
    ln = ln.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    if(/^##\s+/.test(ln)){ if(inUl){html+='</ul>';inUl=false;} html+='<h4>'+ln.replace(/^##\s+/,'')+'</h4>'; }
    else if(/^[-*]\s+/.test(ln)){ if(!inUl){html+='<ul>';inUl=true;} html+='<li>'+ln.replace(/^[-*]\s+/,'')+'</li>'; }
    else if(ln.trim()===''){ if(inUl){html+='</ul>';inUl=false;} }
    else { if(inUl){html+='</ul>';inUl=false;} html+='<p>'+ln+'</p>'; }
  }
  if(inUl) html+='</ul>';
  return html;
}

async function commission(charId){
  const biz = document.getElementById('cm-biz').value;
  let brief = document.getElementById('cm-brief').value.trim();
  const initiative = !brief;
  const btn = document.getElementById('cm-go');
  btn.innerHTML = '<i class="spin"></i> ' + (initiative?'Partner assessing the portfolio…':'Working…'); btn.disabled = true;
  const c = charById(charId);
  const memory = `\nYour recent track record with this CEO (learn from the verdicts; repeat what gets sealed, drop what gets rejected):\n${trackRecord(charId)}\n`;
  const ask = memory + (initiative
    ? `The CEO has given you NO brief. you are trusted to act on your own initiative. Firm state:\n${firmState()}\n\nBusiness in focus: ${BIZ[biz].name} (but you may argue for another if your domain demands it). Choose the single highest-value task in your domain right now. Open with ## Self-Directed Brief (2 lines: what you chose and why), then deliver the complete work product.`

/* Site reliability check. real pings */
const SITES = [
  {name:'SetPostGo', url:'https://setpostgo.xyz'},
  {name:'NAGORI',    url:'https://nagori.xyz'},
  {name:'RenviaIT',  url:'https://renviait.co.uk'}
];
async function pingSite(url){
  const t0 = performance.now();
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 10000);
  try{
    await fetch(url + '/?nh=' + Date.now(), {mode:'no-cors', cache:'no-store', signal:ctrl.signal});
    clearTimeout(timer);
    return {up:true, ms: Math.round(performance.now()-t0)};
  }catch(e){ clearTimeout(timer); return {up:false, ms:null}; }
}
async function siteCheck(){
  const btn = document.getElementById('sitebtn');
  const out = document.getElementById('sitecheck-out');
  btn.innerHTML = '<i class="spin"></i> Checking estate…'; btn.disabled = true;
  const results = [];
  for(const s of SITES){
    const r = await pingSite(s.url);
    results.push({...s, ...r});
    out.innerHTML = results.map(x=>`
      <div class="kpirow" style="margin:6px 0">
        <span style="color:${x.up?'var(--jade)':'var(--rust)'}">${x.up?'&#9679;':'&#9675;'} ${x.name}</span>
        <span class="mono" style="flex:none;font-size:12px;color:var(--muted)">${x.up? x.ms+' ms':'UNREACHABLE'}</span>
      </div>`).join('');
  }
  const summary = results.map(x=>`${x.name} (${x.url}): ${x.up? 'reachable, '+x.ms+'ms from CEO device':'UNREACHABLE or blocked'}`).join('\n');
  let report;
  try{
    report = await callClaude(
      charById('tobias').sys + '\n\n' + FIRM_CTX,
      `Day ${S.day} estate check from the CEO's mobile device:\n${summary}\n\nNote: checks are browser no-cors pings. an "unreachable" result can also mean a network/CORS quirk, so state severity honestly. File your reliability report: ## Status, ## Assessment (per site), ## Recommended checks (free tools: UptimeRobot 5-min monitors, PageSpeed Insights, Netlify deploy logs), and CEO ACTIONS.`, 800);
  }catch(e){
    report = '## Status\n' + results.map(x=>`- **${x.name}**. ${x.up? 'UP, '+x.ms+'ms':'UNREACHABLE from this device'}`).join('\n') +
      '\n\n## Note\nAutomated assessment unavailable (no API connection). Raw ping results filed.\n\n## CEO ACTIONS\n- Set up free UptimeRobot monitors (5-minute checks, email alerts) for all three domains\n- Check Netlify deploy status for any site showing unreachable';
  }
  S.docket.push({ id:uid(), day:S.day, charId:'tobias', biz: results.every(r=>r.up)?'setpostgo':'renviait', brief:'Estate reliability check. Day '+S.day, output:report, status:'pending' });
  save();
  btn.disabled = false; btn.textContent = 'Run site check';
  renderNav();
  out.innerHTML += `<p class="tiny" style="margin-top:8px">Tobias filed his report to your Docket.</p>`;
}

function errMsg(e){
  const m = String(e.message||e);
  if(m.includes('401')||m.includes('403')) return 'Authentication failed. Open Settings (top right) and paste your Anthropic API key.';
  if(m.includes('Failed to fetch')) return 'Network blocked. On GitHub Pages you need your Anthropic API key set in Settings (top right).';
  return 'The call failed: '+m;
}

/* ============ AUTOPILOT SYNC ============ */
if(!S.imported) S.imported = {};
async function syncAutopilot(){
  try{
    const res = await fetch('autopilot.json?nh=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const ap = await res.json();
    let added = 0;
    for(const it of (ap.items||[])){
      if(S.imported[it.id]) continue;
      S.imported[it.id] = true;
      if(it.type === 'standup'){ S.standups.push({ day:S.day, text:'**Overnight cycle \u00b7 '+it.date+'**\n\n'+it.output }); }
      else { S.docket.push({ id:it.id, day:S.day, charId:it.charId, biz:it.biz||'setpostgo', brief:it.title, output:it.output, status:'pending' }); }
      added++;
    }
    if(added){ S.lastSync = (ap.generated||new Date().toISOString()); save(); render(); }
  }catch(e){ /* autopilot not deployed yet - silent */ }
}
syncAutopilot();

render();
