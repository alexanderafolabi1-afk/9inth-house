<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ninth House | Growth Partners</title>
<meta name="theme-color" content="#12161C">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ninth House">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312161C'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23C9A557' font-family='serif'%3E%E2%99%83%3C/text%3E%3C/svg%3E">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Albert+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12161C; --panel:#1B222B; --panel2:#161C23; --line:#2A333E;
  --paper:#E9E2D0; --dim:#9C948074; --muted:#A79F8C; --faint:#6E7683;
  --gold:#C9A557; --gold-deep:#8F7434; --jade:#5FA98B; --rust:#B5563F;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{
  font-family:'Albert Sans',system-ui,sans-serif; background:var(--ink); color:var(--paper);
  min-height:100dvh; padding-bottom:calc(84px + env(safe-area-inset-bottom));
  font-size:15px; line-height:1.55;
}
.serif{font-family:'Marcellus',serif}
.mono{font-family:'Spline Sans Mono',monospace}

/* Header */
header{
  position:sticky; top:0; z-index:40; background:linear-gradient(to bottom, var(--ink) 82%, transparent);
  padding:calc(14px + env(safe-area-inset-top)) 18px 12px; display:flex; align-items:center; gap:12px;
}
.glyph{
  width:40px;height:40px;border:1px solid var(--gold-deep);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--gold);
  font-size:22px;flex-shrink:0;font-family:'Marcellus',serif;
}
.brand h1{font-family:'Marcellus',serif;font-size:17px;font-weight:400;letter-spacing:.12em;text-transform:uppercase}
.brand small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;margin-top:1px}
.hspace{flex:1}
.daychip{
  font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--gold);
  border:1px solid var(--line);border-radius:20px;padding:5px 11px;background:var(--panel2);white-space:nowrap;
}
.gear{background:none;border:none;color:var(--muted);font-size:19px;cursor:pointer;padding:6px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;flex:none}

main{padding:4px 18px 24px;max-width:680px;margin:0 auto}
/* Wider working canvas on desktop: cards flow into a responsive grid,
   section furniture (eyebrows, stats, notices) spans the full row.
   Single column preserved on mobile; no behavioural changes. */
@media(min-width:900px){
  main{max-width:1180px;padding:6px 26px 30px}
  #app{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #app > *{grid-column:1 / -1}
  #app > .card{grid-column:auto;margin:0}
}
@media(min-width:1220px){
  main{max-width:1280px}
  #app{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* Section furniture */
.eyebrow{
  font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);
  margin:26px 0 10px;display:flex;align-items:center;gap:10px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:12px;
}
.card h3{font-family:'Marcellus',serif;font-weight:400;font-size:16px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px}
.tiny{color:var(--faint);font-size:11.5px}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--paper);
  font-family:'Albert Sans',sans-serif;font-size:13.5px;font-weight:600;padding:11px 16px;cursor:pointer;
  transition:transform .08s ease, border-color .15s;
  min-height:44px;min-width:44px;
}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#171309}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:9px;min-height:44px}
.btn:disabled{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* Wax seal. signature element */
.seal{
  width:58px;height:58px;border-radius:50%;flex-shrink:0;cursor:pointer;border:none;
  background:radial-gradient(circle at 35% 30%, #E3C176, var(--gold) 55%, var(--gold-deep));
  color:#241B07;font-family:'Marcellus',serif;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  box-shadow:0 3px 10px rgba(201,165,87,.35), inset 0 0 0 3px rgba(36,27,7,.25), inset 0 0 0 5px rgba(233,226,208,.25);
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;
  transition:transform .12s ease;
}
.seal:active{transform:scale(.85) rotate(-8deg)}
.seal.stamped{background:radial-gradient(circle at 35% 30%, #7FC4A6, var(--jade) 55%, #3D7560);color:#0C1D16;pointer-events:none}
@media (prefers-reduced-motion: reduce){.seal,.btn{transition:none}}

/* Stat grid */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px}
.stat b{font-family:'Spline Sans Mono',monospace;font-size:21px;font-weight:500;display:block;color:var(--paper)}
.stat span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Characters */
.char{display:flex;gap:13px;align-items:flex-start}
.avatar{
  width:96px;height:96px;border-radius:10px;flex-shrink:0;border:1px solid var(--gold-deep);
  display:flex;align-items:center;justify-content:center;font-family:'Marcellus',serif;
  font-size:15px;color:var(--gold);background:var(--panel2);
  position:relative;overflow:hidden;
}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px}
.char h3{font-size:15.5px}
.role{color:var(--gold);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:1px 0 4px}
.region{font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:6px}

/* Docket */
.docket-item{border-left:3px solid var(--gold-deep)}
.docket-item.approved{border-left-color:var(--jade)}
.docket-item.rejected{border-left-color:var(--rust);opacity:.65}
.status{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.status.approved{color:var(--jade);border-color:var(--jade)}
.status.rejected{color:var(--rust);border-color:var(--rust)}
.output{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:13px 14px;margin-top:10px;font-size:13.5px;color:#D8D2C2;max-height:340px;overflow-y:auto;
}
.output h4{font-family:'Marcellus',serif;font-weight:400;color:var(--gold);margin:12px 0 5px;font-size:14px}
.output h4:first-child{margin-top:0}
.output ul{margin:5px 0 8px 17px}
.output li{margin-bottom:4px}
.output p{margin-bottom:8px}
.output strong{color:var(--paper)}

/* Forms */
textarea,input[type=text],input[type=password],input[type=number],select{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--paper);font-family:'Albert Sans',sans-serif;font-size:14px;padding:11px 12px;outline:none;
}
textarea{min-height:88px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--gold-deep)}
label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
select{appearance:none;-webkit-appearance:none}

/* A password field with an eye on the right, so the owner can read back what
   the phone keyboard actually typed before committing to it. The eye is a full
   tap target in its own right, so it keeps the forty four pixel minimum even
   though the input it sits inside is a shade shorter than that. */
.pwwrap{position:relative}
.pwwrap input{padding-right:46px}
.pweye{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;padding:0;border-radius:10px;color:var(--faint);cursor:pointer;
}
.pweye:hover,.pweye:focus-visible{color:var(--gold)}

/* Bottom nav */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(18,22,28,.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;background:none;border:none;color:var(--faint);padding:11px 0 9px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Albert Sans',sans-serif;
}
nav button .ic{font-size:17px;line-height:1}
nav button span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
nav button.on{color:var(--gold)}
nav button .badge{
  position:absolute;transform:translate(14px,-4px);background:var(--rust);color:#fff;
  font-size:9px;font-family:'Spline Sans Mono',monospace;border-radius:8px;padding:0 5px;min-width:15px;text-align:center;
}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.78);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:680px;max-height:88dvh;overflow-y:auto}
.modal h2{font-family:'Marcellus',serif;font-weight:400;font-size:18px;margin-bottom:4px;padding-right:40px}
/* Always present on every panel: the one way back on a phone with no visible
   chrome to tap outside of. Top right, a full 44px target, offset past the
   notch and the rounded corner on either safe-area edge. */
.modal-close{
  position:absolute;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;border-radius:10px;color:var(--faint);font-size:22px;line-height:1;cursor:pointer;
}
.modal-close:hover,.modal-close:focus-visible{color:var(--gold)}

.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(233,226,208,.25);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.hr{height:1px;background:var(--line);margin:16px 0}
.kpirow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.kpirow span{flex:1;font-size:13.5px}
.kpirow input{width:110px;font-family:'Spline Sans Mono',monospace;font-size:13px;text-align:right}
.notice{background:var(--panel2);border:1px dashed var(--gold-deep);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--muted);margin-bottom:12px}

/* ============ MOBILE SPECIFICATION ============ */
/* This is a phone app that also works on a desktop, not the other way round. */

/* Sixteen pixels is the threshold below which iOS Safari zooms the whole page on
   focus, which then leaves the layout scrolled sideways and the keyboard covering
   the field. Every text entry is at or above it. */
input[type=text],input[type=password],input[type=number],input[type=url],input[type=search],
input[type=datetime-local],input[type=time],input[type=date],textarea,select{font-size:16px}
.kpirow input{font-size:16px}

/* A tick box is a tap target, so the whole row is the target rather than the
   twenty pixel square inside it. .tapline is at least the minimum height and its
   label toggles the box, which is what makes these usable with a thumb. */
.tapline{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.tapline input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--jade)}

/* Every bottom nav target clears the minimum on its own. */
nav button{min-height:56px;min-width:44px}

/* Nothing may scroll sideways, at any width the phone market actually ships. */
html,body{overflow-x:hidden;max-width:100%}
main{overflow-x:hidden}
pre,code,.mono{overflow-wrap:anywhere;word-break:break-word}

/* ============ THE MORNING QUEUE ============ */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qhead .btn{flex:none}

.qcard{
  position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:12px;overflow:hidden;touch-action:pan-y;
}
.qcard.gone{opacity:.45}
/* The swipe layer moves, the card does not, so the action hint underneath stays put. */
.qswipe{transition:transform .18s ease;background:var(--panel);position:relative;z-index:2}
.qcard.dragging .qswipe{transition:none}
.qhint{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;z-index:1;
}
.qhint .yes{color:var(--jade)}
.qhint .no{color:var(--rust)}

.qmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.qtag{
  font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
.qtag.venture{color:var(--gold);border-color:var(--gold-deep)}
.qtag.count.over{color:var(--rust);border-color:var(--rust)}
.qtag.state.failed{color:var(--rust);border-color:var(--rust)}
.qtag.state.scheduled{color:var(--jade);border-color:var(--jade)}

.qtext{font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:10px}
.qcard textarea{min-height:150px;line-height:1.5}
.qnote{background:var(--panel2);border-left:2px solid var(--gold-deep);padding:8px 10px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--muted);white-space:pre-wrap;margin-bottom:10px}
.qerr{background:rgba(181,86,63,.12);border-left:2px solid var(--rust);padding:8px 10px;border-radius:0 8px 8px 0;font-size:12.5px;color:#E5A192;margin-bottom:10px}
.qimg{width:100%;max-height:190px;object-fit:cover;border-radius:9px;border:1px solid var(--line);margin-bottom:10px;background:var(--panel2)}

/* The row of actions. Approve sits at one end and skip at the other, with a gap
   between them, so a thumb cannot catch the wrong one on the way past. */
.qacts{display:flex;gap:10px;align-items:stretch}
.qacts .btn{min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;flex:1}
.qacts .spacer{flex:0 0 24px}
.qmore{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.qmore .btn{min-height:44px;flex:1;min-width:104px;display:flex;align-items:center;justify-content:center}
.btn.jade{background:var(--jade);color:#0B1410;border-color:var(--jade);font-weight:600}
.btn.danger{color:var(--rust);border-color:rgba(181,86,63,.5)}

/* The undo toast. Above the nav, inside the safe area, and wide enough to hit. */
#toast{
  position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:70;
  background:var(--panel);border:1px solid var(--gold-deep);border-radius:12px;
  padding:12px 14px;display:none;align-items:center;gap:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.45);max-width:660px;margin:0 auto;
}
#toast.show{display:flex}
#toast span{flex:1;font-size:13.5px}
#toast button{min-height:44px;min-width:76px;padding:0 14px;border-radius:9px;border:1px solid var(--gold-deep);background:none;color:var(--gold);font-family:'Albert Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer}

/* The refresh control. Present on every tab, not tied to #app, so it survives
   every render(). Sitting well above the toast's own row (bottom: 92px) so
   the two never fight for the same strip when both are on screen at once,
   and low enough on the screen to still be a one-handed reach on the way
   down from the nav bar. */
.refresh-fab{
  position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(150px + env(safe-area-inset-bottom));z-index:52;
  width:50px;height:50px;min-width:44px;min-height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--gold);border:1px solid var(--gold-deep);color:var(--ink);
  font-size:19px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.5);
}
.refresh-fab .ic{display:inline-block;line-height:1}
.refresh-fab.spinning .ic{animation:sp .8s linear infinite}
.refresh-fab:disabled{opacity:.6}

.qstat{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.qstat .cell{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:132px}
.qstat .cell b{display:block;font-family:'Marcellus',serif;font-size:15px;color:var(--gold);font-weight:400}
.qstat .cell small{color:var(--faint);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}

.offline{background:rgba(181,86,63,.14);border:1px solid var(--rust);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}

/* Desktop gets more room, and not one feature more. */
@media (min-width:820px){
  .qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;align-items:start}
  .qcard{margin-bottom:0}
}
</style>
</head>
<body>

<header>
  <div class="glyph">&#9795;</div>
  <div class="brand">
    <h1>Ninth House</h1>
    <small>Growth Partners &middot; A Lyr&#299;on Company</small>
  </div>
  <div class="hspace"></div>
  <div class="daychip" id="daychip">DAY 001</div>
  <button class="gear" id="gearbtn" onclick="CP_MSG='';openSettings()" aria-label="Settings">&#9881;</button>
</header>

<main id="app"></main>

<nav id="nav"></nav>
<button type="button" id="refreshfab" class="refresh-fab" aria-label="Refresh" onclick="refreshCurrent()"><i class="ic">&#8635;</i></button>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ STATE ============ */
const LS_KEY = 'ninthhouse_v1';
const defaultState = () => ({
  day: 1, wa: '447448668350',
  pendingActions: [],            // approvals taken offline, replayed when the signal returns
  docket: [],            // {id, day, charId, biz, brief, output, status}
  ledger: [],            // {text, day} durable facts the house learns about the keeper (this device only)
  standups: [],          // {day, text}
  minutes: [],           // {day, text}
  execDone: {},          // id -> true when executed IRL
  shipped: {},           // id -> true when a Morning Tray item was actually published or sent
  backers: [],           // {id, name, amount, tier, date, code, quarterlyUpdateSent} the CEO's fundraiser
  weeklyTarget: '',      // plain text, CEO-edited, no API call
  kpis: {
    setpostgo: { 'Active subscribers': 0, 'Trials started (wk)': 0, 'MRR £': 0 },
    renviait:  { 'Units acquired (wk)': 0, 'Units sold (wk)': 0, 'Revenue £ (mo)': 0 },
    nagori:    { 'Letters sealed': 0, 'Visitors (wk)': 0, 'Revenue £ (mo)': 0 }
  },
  kpiDay: {}
});
let S = load();
function load(){
  const base = defaultState();
  let saved = base;
  try{ const r = localStorage.getItem(LS_KEY); if(r) saved = Object.assign(base, JSON.parse(r)); }catch(e){ saved = defaultState(); }
  // Shallow merge leaves nested defaults behind, so the per venture KPI blocks are
  // restored one at a time. Without this a partial saved state throws on render.
  const kpiDefaults = defaultState().kpis;
  if(!saved.kpis || typeof saved.kpis !== 'object') saved.kpis = {};
  for(const key of Object.keys(kpiDefaults)){
    saved.kpis[key] = Object.assign({}, kpiDefaults[key], saved.kpis[key] || {});
  }
  if(!Array.isArray(saved.pendingActions)) saved.pendingActions = [];
  return saved;
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ============ THE BACKERS LEDGER. Bea Whitmore ============ */
const BACKER_TIERS = [
  { label:'Under £50', min:0, perk:'A personal thank you from the CEO and a name on the Wall of Backers.' },
  { label:'£50 and above', min:50, perk:'Named on the Wall of Backers, plus a lifetime 20% discount code across every house product.' },
  { label:'£250 and above', min:250, perk:'All of the above, plus a seat at The House Table: priority access to future ventures and one free Boardroom Session.' },

      'From the CEO brief and the deliverable below, extract up to three short durable facts about the principal himself: his preferences, situation, constraints or goals (for example "prefers evening deep work" or "prioritising credit rebuild until autumn"). Only facts likely to stay true for weeks. One per line, no numbering, under 12 words each. If there is nothing durable about the person, output only NONE.\n\nBRIEF: ' + brief + '\n\nDELIVERABLE:\n' + body,
      300, true);
    const lines = (out || '').split('\n').map(s => s.replace(/^[-*\d.\s]+/, '').trim())
      .filter(s => s && s.toUpperCase() !== 'NONE' && s.length >= 4 && s.length <= 90);
    let added = 0;

}

/* ============ CLAUDE, VIA THE WORKER ============ */
/* The browser never talks to Anthropic. It sends the system/user prompt (built
   here from character bios and firm state, none of it secret) to the Worker's
   /desk/ask, which holds ANTHROPIC_API_KEY and is the only thing that calls
   Anthropic. Same session-token auth, same engine() helper, as every other
   admin action. */
// Every partner the desk speaks to comes through here, and every one of them
// was being cut off before it could answer.
//
// engine() waits twenty seconds by default, which is right for a queue read and
// nowhere near enough for this. These calls carry the web search tool, so the
// model runs several searches before it writes anything and a minute is
// ordinary. The browser was giving up first, every time, which is why the
// standup button appeared to do nothing and then complained it could not reach
// the house: it never got an answer because it stopped listening for one.
//
// A hundred and ten seconds, so the Worker's own eighty five second bound on
// Anthropic always expires first and what comes back is a readable reason
// rather than a request that vanished.
const AI_TIMEOUT_MS = 110000;

async function callClaude(system, user, maxTokens, skipLedger){
  const data = await engine('/desk/ask', {
    system: skipLedger ? system : (system + ledgerBlock()),
    user,
    max_tokens: maxTokens || 1000
  }, 'POST', { timeoutMs: AI_TIMEOUT_MS });
  return data.text || '';
}

/* markdown-lite */
function md(t){
  const lines = esc(t||'').split('\n'); let html='', inUl=false;
  for(let ln of lines){
    ln = ln.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    if(/^##\s+/.test(ln)){ if(inUl){html+='</ul>';inUl=false;} html+='<h4>'+ln.replace(/^##\s+/,'')+'</h4>'; }
    else if(/^[-*]\s+/.test(ln)){ if(!inUl){html+='<ul>';inUl=true;} html+='<li>'+ln.replace(/^[-*]\s+/,'')+'</li>'; }
    else if(ln.trim()===''){ if(inUl){html+='</ul>';inUl=false;} }
    else { if(inUl){html+='</ul>';inUl=false;} html+='<p>'+ln+'</p>'; }
  }
  if(inUl) html+='</ul>';
  return html;
}

// succeeds, checkSession's next call reports needsSetup: false forever, and
// this screen is never shown again on this Worker.
function vSetup(){
  return `
  <div class="eyebrow">Ninth House</div>
  <div class="card" style="max-width:420px;margin:10vh auto 0">
    <h3 class="serif" style="font-size:19px;margin-bottom:6px">Create your password</h3>
    <p class="sub">First run. Choose the one password that opens the desk from here on. Nothing gets set by hand in Cloudflare.</p>
    ${LOGIN_MSG ? `<p class="sub" style="color:var(--rust);margin-top:8px">${esc(LOGIN_MSG)}</p>` : ''}
    <label style="margin-top:14px">Password</label>
    ${pwField('setup-password', 'new-password', `onkeydown="if(event.key==='Enter')doSetup()"`)}
    <label>Confirm password</label>
    ${pwField('setup-confirm', 'new-password', `onkeydown="if(event.key==='Enter')doSetup()"`)}
    <div class="btnrow" style="margin-top:14px">
      <button class="btn gold wide" id="setup-btn" style="min-height:44px" onclick="doSetup()">Create password &amp; sign in</button>
    </div>
  </div>`;
}

async function doSetup(){
  const btn = document.getElementById('setup-btn');
  if(btn.disabled) return;
  const pwEl = document.getElementById('setup-password');
  const confEl = document.getElementById('setup-confirm');
  const password = pwEl ? pwEl.value : '';
  const confirm = confEl ? confEl.value : '';
  if(!password || password.length < 8){ LOGIN_MSG = 'Choose a password of at least 8 characters.'; render(); return; }
  if(password !== confirm){ LOGIN_MSG = 'Those did not match.'; render(); return; }
  btn.innerHTML = '<i class="spin"></i> Creating…'; btn.disabled = true;
  try{
    const data = await engine('/auth/setup', { password, confirm }, 'POST', { timeoutMs: 15000 });
    storeToken(data.token);
    AUTHED = true; NEEDS_SETUP = false; LOGIN_MSG = '';
    render();
    afterLogin();
  }catch(e){
    LOGIN_MSG = e.message || 'Could not create the password.';
    render();
    const again = document.getElementById('setup-password');
    if(again) again.focus();
  }
}

function vLogin(){
  return `
  <div class="eyebrow">Ninth House</div>
  <div class="card" style="max-width:420px;margin:10vh auto 0">
    <h3 class="serif" style="font-size:19px;margin-bottom:6px">Sign in</h3>
    <p class="sub">One owner, one password. The house waits for you.</p>
    ${LOGIN_MSG ? `<p class="sub" style="color:var(--rust);margin-top:8px">${esc(LOGIN_MSG)}</p>` : ''}
    <label style="margin-top:14px">Password</label>
    ${pwField('login-password', 'current-password', `onkeydown="if(event.key==='Enter')doLogin()"`)}
    <div class="btnrow" style="margin-top:14px">
      <button class="btn gold wide" id="login-btn" style="min-height:44px" onclick="doLogin()">Sign in</button>
    </div>
  </div>`;
}

// Every password box in the desk is built through pwField, so the eye behaves
// the same on the first run screen, on sign in and in Change password. The eye
// is a plain view toggle: it flips the input type and never touches the value,
// and nothing is remembered, so a re-render always comes back hidden.
const EYE_LINES = 'viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
const EYE_OPEN = `<svg ${EYE_LINES}><path d="M1.8 12S5.6 5 12 5s10.2 7 10.2 7-3.8 7-10.2 7S1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_SHUT = `<svg ${EYE_LINES}><path d="M1.8 12S5.6 5 12 5s10.2 7 10.2 7-3.8 7-10.2 7S1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3"/><path d="m3.6 3.6 16.8 16.8"/></svg>`;

function pwField(id, autocomplete, extra){
  return `<div class="pwwrap">
      <input type="password" id="${id}" autocomplete="${autocomplete}" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"${extra ? ' ' + extra : ''}>
      <button type="button" class="pweye" id="${id}-eye" aria-label="Show password" title="Show password" onclick="togglePw('${id}')">${EYE_OPEN}</button>
    </div>`;
}

function togglePw(id){
  const input = document.getElementById(id);
  const btn = document.getElementById(id + '-eye');
  if(!input || !btn) return;
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.innerHTML = showing ? EYE_OPEN : EYE_SHUT;
  const label = showing ? 'Show password' : 'Hide password';
  btn.setAttribute('aria-label', label);
  btn.setAttribute('title', label);
}

async function doLogin(){
  const btn = document.getElementById('login-btn');
  if(btn.disabled) return; // already in flight; the Enter key and the button can both call this
  const input = document.getElementById('login-password');
  const password = input ? input.value : '';
  if(!password){ LOGIN_MSG = 'Enter the password.'; render(); return; }
  btn.innerHTML = '<i class="spin"></i> Signing in…'; btn.disabled = true;
  try{
    const data = await engine('/auth/login', { password }, 'POST', { timeoutMs: 15000 });
    storeToken(data.token);
    AUTHED = true; LOGIN_MSG = '';
    render();
    afterLogin();
  }catch(e){
    LOGIN_MSG = e.message || 'Sign in failed.';
    render();
    const again = document.getElementById('login-password');
    if(again) again.focus();
  }
}

async function logout(){
  try{ await engine('/auth/logout', {}, 'POST', { timeoutMs: 10000 }); }catch(e){ /* clearing client state regardless */ }
  storeToken(null);
  AUTHED = false; LOGIN_MSG = '';
  closeModal();
  render();
}

async function checkSession(){
  try{
    const data = await engine('/auth/session', null, 'GET', { retries: 1, timeoutMs: 10000 });
    AUTHED = Boolean(data.authed);
    NEEDS_SETUP = Boolean(data.needsSetup);
    LOGIN_MSG = '';
  }catch(e){
    // A failed check used to leave NEEDS_SETUP at its default of false, which
    // drew the sign in form. That is the wrong fallback and it hides the real
    // fault: it is not that a password exists, it is that the engine could not
    // be asked, and no password typed into that form can succeed. Say which it
    // is, so a sign in screen always means a password really is set.
    AUTHED = false;
    LOGIN_MSG = e && e.message ? e.message : 'The engine could not be reached, so the desk cannot tell whether a password has been set.';
  }
  render();
  if(AUTHED) afterLogin();
}

// Runs once, after the session is confirmed (fresh login or a page load that
// finds a still-valid token already in localStorage). Everything that needs
// the engine and used to fire unconditionally at boot now waits for this
// instead.
function afterLogin(){
  syncAutopilot();
  loadQueue(true);
  // Loaded quietly alongside the queue rather than on first sight of the tab,
  // because the whole point of a message with an hour on it is that it is
  // already on screen when he opens the desk that morning.
  loadOutreach(true);
}

/* Daily cycle */
// A spinner that never changes is indistinguishable from a dead button, and
// these calls genuinely run for the best part of a minute because the partners
// search the web before they answer. Counting up says the difference out loud.
// Returns the stopper; the caller's render() replaces the button either way, so
// clearing the interval is all it has to do.
function countUpOn(btn, label){
  const started = Date.now();
  const tick = () => {
    const secs = Math.round((Date.now() - started) / 1000);
    btn.innerHTML = `<i class="spin"></i> ${label} ${secs}s`;
  };
  tick();
  const id = setInterval(tick, 1000);
  return () => clearInterval(id);
}

async function runCycle(){
  const btn = document.getElementById('cyclebtn');
  btn.disabled = true;
  const stop = countUpOn(btn, 'Convening standup…');
  S.day += 1;
  try{
    const out = await callClaude(
      charById('maren').sys + '\n\n' + FIRM_CTX,
      `It is Day ${S.day} at Ninth House. Firm state:\n${firmState()}\n\nRun the daily standup. Deliver: ## Situation (3 lines max), ## Today's Top 3 Priorities (which partner should do what, for which business, and why), ## One Risk I'm Watching. Keep it tight.`, 800);
    stop();
    S.standups.push({ day:S.day, text:out });
    save(); render();
  }catch(e){ stop(); S.day -= 1; save(); render(); alert(errMsg('Convening the standup', e)); }
}

/* Site reliability check. real pings */
const SITES = [
  {name:'SetPostGo', url:'https://setpostgo.xyz'},
  {name:'NAGORI',    url:'https://nagori.xyz'},
  {name:'RenviaIT',  url:'https://renviait.co.uk'}
];
async function pingSite(url){
  const t0 = performance.now();
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 10000);
  try{
    await fetch(url + '/?nh=' + Date.now(), {mode:'no-cors', cache:'no-store', signal:ctrl.signal});
    clearTimeout(timer);
    return {up:true, ms: Math.round(performance.now()-t0)};
  }catch(e){ clearTimeout(timer); return {up:false, ms:null}; }
}
async function siteCheck(){
  const btn = document.getElementById('sitebtn');
  const out = document.getElementById('sitecheck-out');
  btn.innerHTML = '<i class="spin"></i> Checking estate…'; btn.disabled = true;
  const results = [];
  for(const s of SITES){
    const r = await pingSite(s.url);
    results.push({...s, ...r});
    out.innerHTML = results.map(x=>`
      <div class="kpirow" style="margin:6px 0">
        <span style="color:${x.up?'var(--jade)':'var(--rust)'}">${x.up?'&#9679;':'&#9675;'} ${x.name}</span>
        <span class="mono" style="flex:none;font-size:12px;color:var(--muted)">${x.up? x.ms+' ms':'UNREACHABLE'}</span>
      </div>`).join('');
  }
  const summary = results.map(x=>`${x.name} (${x.url}): ${x.up? 'reachable, '+x.ms+'ms from CEO device':'UNREACHABLE or blocked'}`).join('\n');
  let report;
  try{
    report = await callClaude(
      charById('tobias').sys + '\n\n' + FIRM_CTX,
      `Day ${S.day} estate check from the CEO's mobile device:\n${summary}\n\nNote: checks are browser no-cors pings. an "unreachable" result can also mean a network/CORS quirk, so state severity honestly. File your reliability report: ## Status, ## Assessment (per site), ## Recommended checks (free tools: UptimeRobot 5-min monitors, PageSpeed Insights, Netlify deploy logs), and CEO ACTIONS.`, 800);
  }catch(e){
    report = '## Status\n' + results.map(x=>`- **${x.name}**. ${x.up? 'UP, '+x.ms+'ms':'UNREACHABLE from this device'}`).join('\n') +
      '\n\n## Note\nAutomated assessment unavailable (no API connection). Raw ping results filed.\n\n## CEO ACTIONS\n- Set up free UptimeRobot monitors (5-minute checks, email alerts) for all three domains\n- Check Netlify deploy status for any site showing unreachable';
  }
  S.docket.push({ id:uid(), day:S.day, charId:'tobias', biz: results.every(r=>r.up)?'setpostgo':'renviait', brief:'Estate reliability check. Day '+S.day, output:report, status:'pending' });

  const done = appr.filter(d=>S.execDone[d.id]).length;
  const recent = S.docket.slice(-6).map(d=>`- [${d.status}] ${charById(d.charId).name} → ${BIZ[d.biz].name}: ${d.brief.slice(0,80)}`).join('\n') || '- No work commissioned yet.';
  return `Pending approvals: ${pend}. Approved deliverables: ${appr.length} (${done} executed by CEO in real life).
Recent docket:\n${recent}
KPIs: SetPostGo ${JSON.stringify(S.kpis.setpostgo)} | RenviaIT ${JSON.stringify(S.kpis.renviait)} | NAGORI ${JSON.stringify(S.kpis.nagori)}`;
}

// engine() (and callClaude, which goes through it) already throws a specific,
// actionable message: a timeout, a rate limit, a session expiry, or whatever
// the Worker itself reported. This only ever adds what was being attempted,
// so the owner never sees a bare status string with no context.
// Reject with a reason, everywhere in the admin.
//
// One control, used by every approve or reject surface, so a new surface
// inherits it rather than quietly shipping without it. The reason is asked for
// every time and is never compulsory: the owner is often doing this one handed
// on a phone, so Reject stays one tap away and the field is simply there if he
// has something to say.
//
// What he writes is filed against the item AND against the persona that wrote
// it, because a reason attached only to an item teaches nobody. The persona
// reads it back before it works on that venture again.
function rejectWithReason(opts){
  const { title, itemKind, itemId, persona, venture, category, onConfirm } = opts;
  REJECT_PENDING = { itemKind, itemId, persona, venture, category, onConfirm };
  modal(`
    <h2>${esc(title || 'Reject this')}</h2>
    <p class="sub">Why, in a line? It goes to whoever wrote it, and they read it before working on this venture again. You can leave it blank.</p>
    <label style="margin-top:12px">Reason, optional</label>
    <textarea id="reject-reason" rows="3" placeholder="Numbers are out of date. Wrong person. Too pushy. Anything."></textarea>
    <div class="btnrow" style="margin-top:12px">
      <button class="btn wide" id="reject-go" style="min-height:44px;background:var(--rust);color:#fff;border-color:var(--rust)" onclick="confirmReject()">Reject</button>
    </div>
    <div class="btnrow" style="margin-top:8px">
      <button class="btn ghost wide" style="min-height:44px" onclick="closeModal()">Keep it</button>
    </div>
  `);
  setTimeout(() => { const t = document.getElementById('reject-reason'); if(t) t.focus(); }, 120);
}

let REJECT_PENDING = null;

async function confirmReject(){
  const p = REJECT_PENDING;
  if(!p) return closeModal();
  const btn = document.getElementById('reject-go');
  const reason = ((document.getElementById('reject-reason') || {}).value || '').trim();
  if(btn){ btn.innerHTML = '<i class="spin"></i> Rejecting…'; btn.disabled = true; }
  REJECT_PENDING = null;
  closeModal();
  // The rejection itself happens whatever the reason does. Losing the verdict
  // because the note failed to save would be the worse of the two failures.
  try{
    if(typeof p.onConfirm === 'function') await p.onConfirm(reason);
  }catch(e){
    toast(errMsg('Rejecting', e));
  }
  // A post carries its reason on the skip call itself, so filing it a second
  // time here would double count it.
  if(p.itemKind !== 'social_post'){
    try{
      await engine('/social/feedback', {
        itemKind: p.itemKind, itemId: p.itemId,
        persona: p.persona, venture: p.venture, category: p.category,
        verdict: 'rejected', reason
      }, 'POST', { timeoutMs: 15000 });
    }catch(e){
      // Kept locally so a reason given offline is not lost, and flushed with
      // the rest of the pending actions when the signal returns.
      queueOffline('/social/feedback', {
        itemKind: p.itemKind, itemId: p.itemId,
        persona: p.persona, venture: p.venture, category: p.category,
        verdict: 'rejected', reason
      });
    }
  }
  if(reason) toast('Rejected, and the reason has gone to them.');
  else toast('Rejected.');
}

function errMsg(action, e){
  const m = String((e && e.message) || e || 'unknown error');
  return action + ' failed: ' + m;
}

// How long ago a figure was last checked against the live source, said the way
// a person would say it. The owner should not have to read a timestamp to know
// whether a number is current.
function factAge(iso){
  const t = Date.parse(iso || '');
  if(!Number.isFinite(t)) return 'never';
  const hours = (Date.now() - t) / 3600000;
  if(hours < 1) return 'just now';
  if(hours < 24) return Math.round(hours) + 'h ago';
  const days = Math.floor(hours / 24);
  return days === 1 ? 'yesterday' : days + ' days ago';
}

    if(!res.ok) return;
    const ap = await res.json();
    let added = 0;
    for(const it of (ap.items||[])){
      if(S.imported[it.id]) continue;
      S.imported[it.id] = true;
      if(it.type === 'standup'){ S.standups.push({ day:S.day, text:'**'+(it.title||'Standup')+' \u00b7 '+it.date+'**\n\n'+it.output }); }
      else { S.docket.push({ id:it.id, day:S.day, charId:it.charId, biz:it.biz||'setpostgo', brief:it.title, output:it.output, status:'pending' }); }
      added++;
    }
    if(added){ S.lastSync = (ap.generated||new Date().toISOString()); save(); render(); }
  }catch(e){ /* autopilot not deployed yet - silent */ }
}

// Kept as a function, not folded into a plain AUTHED check, so every existing
// call site (loadQueue, flushPending, the visibility/online listeners, the
// final boot line) reads unchanged: the only thing that changed underneath is
// what "ready" means now.
const engineReady = () => AUTHED === true;

// One call site for every /api request the admin makes, AI included. A
// timeout on every call, a single opt-in retry for reads where a repeat is
// harmless, and one place that turns a 401 into "go back to the login
// screen" instead of a dead end, so nothing downstream has to know the
// difference between "not signed in" and "any other failure."
// A reply that is not JSON never came from the engine: something else
// answered before the request reached it. Saying "the house answered with an
// error" in that case points the owner at the wrong thing entirely, and at
// something they cannot fix, so this says what actually happened and ends
// with one line worth reporting verbatim.
function notFromEngine(status, ctype, method, path){
  const kind = String(ctype || '').split(';')[0] || 'no type given';
  return 'That request never reached the engine. Something else answered it instead, with a '
    + status + '. Nothing is wrong with what you typed, and trying again will not help. Report this line '
    + 'as it stands: ' + method + ' ' + ENGINE_BASE + path + ' answered ' + status + ' as ' + kind + '.';
}

// Every call from desk.html goes to the Worker's own address, directly.
// Not the site's own domain, routed through Cloudflare to the Worker: that
// path sits in front of DNS and zone configuration this repo has no way to
// see or fix, has answered with a bare 404 before, and does not need to
// work at all any more, since authentication no longer depends on being
// same-site with it. One base,
// used every time, is also just simpler to reason about than two.
const ENGINE_BASE = 'https://9inth-house-engine.alexanderafolabi1.workers.dev';

// The session token, held here and in localStorage, not a cookie. desk.html
// lives on 9thpoint.com; the Worker answers on the address above, a
// different site, and a cookie set across that boundary is a cross-site
// cookie no matter how it is configured. Mobile Safari does not reliably
// keep that kind of cookie: signed in on a laptop, "session expired" on the
// phone, every time, regardless of how many times the page was closed and
// reopened. A bearer token in an Authorization header has no such policy to
// run into; the browser does not decide whether to send it, this code does,
// on every request, on every browser, the same way. localStorage rather
// than memory alone so it survives closing the PWA and reopening it later,
// which is the whole point of not signing in every morning.
const TOKEN_KEY = 'nh_session_token';
let SESSION_TOKEN = null;
try { SESSION_TOKEN = localStorage.getItem(TOKEN_KEY) || null; } catch (e) { SESSION_TOKEN = null; }

function storeToken(token){
  SESSION_TOKEN = token || null;
  try {
    if (token) localStorage.setItem(TOKEN_KEY, token);
    else localStorage.removeItem(TOKEN_KEY);
  } catch (e) { /* private browsing or storage disabled: the token still works for this load */ }
}

// Something in front of the engine used to pass GET through and refuse POST,
// which made every action on this desk fail, not just signing in. Where a
// POST is refused for this reason, the same call is sent again as a GET
// carrying the method and the body in headers, and the engine rebuilds the
// real request from them.
//
// Off until a POST has actually failed, and remembered for the rest of the
// session once it has, so a desk on a working connection never uses it and one
// on a broken edge only pays the cost of discovering it once. The body rides in
// a header rather than the query string on purpose: a password in a URL ends up
// in history, logs and referrers.
let TUNNEL = false;

async function engine(path, body, method, opts){
  opts = opts || {};
  const timeoutMs = opts.timeoutMs || 20000;
  const attempts = 1 + (opts.retries || 0);
  const wanted = method || (body ? 'POST' : 'GET');
  let lastErr;
  for(let attempt = 1; attempt <= attempts; attempt++){
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try{
      const useTunnel = TUNNEL && wanted !== 'GET';
      const headers = {};
      if(body && !useTunnel) headers['Content-Type'] = 'application/json';
      if(SESSION_TOKEN) headers['Authorization'] = 'Bearer ' + SESSION_TOKEN;
      if(useTunnel){
        headers['X-NH-Method'] = wanted;
        if(body) headers['X-NH-Body'] = JSON.stringify(body);
      }
      const res = await fetch(ENGINE_BASE + path, {
        method: useTunnel ? 'GET' : wanted,
        headers,
        body: (body && !useTunnel) ? JSON.stringify(body) : undefined,
        // Nothing here asks the browser to send or accept a cookie. There is
        // none: the Authorization header above is what carries the session, and
        // headers go out regardless of this setting.
        cache: 'no-store',
        signal: ctrl.signal
      });
      clearTimeout(timer);
      // Read the body as text first, so a reply that is not JSON can be told
      // apart from one that is. The engine answers JSON on every path it
      // handles, including its errors, so anything else did not come from the
      // engine at all and must not be reported as though it had.
      const ctype = res.headers.get('content-type') || '';
      let raw = '';
      try{ raw = await res.text(); }catch(e){ raw = ''; }
      let data = {};
      try{ data = raw ? JSON.parse(raw) : {}; }catch(e){ data = {}; }
      const fromEngine = ctype.indexOf('application/json') !== -1;
      if(res.status === 401 && path !== '/auth/login'){
        // Expired, revoked, or never set: any of the three means this token
        // is no good any more, so it is discarded rather than sent again on
        // every call from here on. A fresh sign-in mints a new one.
        storeToken(null);
        AUTHED = false;
        LOGIN_MSG = 'Your session expired. Sign in again.';
        render();
        throw new Error(LOGIN_MSG);
      }
      if(res.status === 429 && data.error) throw new Error(data.error);
      if(res.status === 503 && data.error) throw new Error(data.error);
      // A reply that is not JSON did not come from the engine, so the request
      // never got there. For anything other than a GET that means the edge
      // refused the method, which the tunnel can get around, so turn it on and
      // send the same call again rather than reporting a failure the owner can
      // do nothing about. Tried once: if the tunnel fails too, the honest
      // message below is the right answer.
      if(!res.ok && !fromEngine && wanted !== 'GET' && !TUNNEL){
        TUNNEL = true;
        clearTimeout(timer);
        return await engine(path, body, method, opts);
      }
      if(!res.ok && !fromEngine) throw new Error(notFromEngine(res.status, ctype, wanted, path));
      if(!res.ok && !data.error) throw new Error('The house answered with an error (status ' + res.status + '). Try again shortly.');
      if(data.error && data.ok === false) throw new Error(data.error);
      return data;
    }catch(e){
      clearTimeout(timer);
      // A timeout, or the browser's own network-level fetch failure (Chrome
      // says "Failed to fetch", Safari/iOS says "Load failed") are the only
      // cases with no real response to read a reason from, so they are the
      // only ones rewritten into a plain-English message here. Anything else
      // caught in this block is already one of the specific errors thrown
      // above, from a real HTTP answer, and is never retried.
      const isTimeout = e && e.name === 'AbortError';
      const rawMsg = e && e.message;
      const isNetworkLevel = isTimeout || rawMsg === 'Failed to fetch' || rawMsg === 'Load failed';

      // The gap the tunnel had left. It only engaged on a reply that was not
      // JSON, which assumes something answered. A method the edge refuses can
      // just as easily produce no reply at all: a blocked preflight, or a
      // connection dropped before anything came back, both surface here as a
      // plain fetch failure with nothing to inspect. Treating that as simply
      // offline was wrong, because on a non-GET it can equally be the same
      // refusal the tunnel exists to get around. A timeout is excluded
      // deliberately: something answered late, and sending it a second time
      // would only ask the house to do the same slow work twice.
      if(isNetworkLevel && !isTimeout && wanted !== 'GET' && !TUNNEL){
        TUNNEL = true;
        return await engine(path, body, method, opts);
      }

      lastErr = isTimeout
        ? new Error('The house did not answer in time. It searches the web before answering, so give it a full minute before deciding it is stuck.')
        : isNetworkLevel
          ? new Error('Could not reach the house. Check your connection and try again.')
          : (e instanceof Error ? e : new Error(String(e)));
      if(!isNetworkLevel || attempt >= attempts) throw lastErr;
    }
  }
  throw lastErr;
}

/* ---------- offline queue ---------- */
/* An approval taken with no signal is kept and replayed, so the morning routine is
   never blocked by a tunnel. Nothing is replayed twice: the engine refuses a second
   send for the same post id, and the entry is dropped once it has been answered. */

function queueOffline(action, payload){
  S.pendingActions = S.pendingActions || [];
  S.pendingActions.push({ action, payload, at: new Date().toISOString() });
  save();
}

async function flushPending(){
  if(!S.pendingActions || !S.pendingActions.length || !navigator.onLine || !engineReady()) return 0;
  const waiting = S.pendingActions.slice();
  let done = 0;
  for(const item of waiting){
    try{
      await engine(item.action, item.payload);
      S.pendingActions = S.pendingActions.filter(x => x !== item);
      done++;
    }catch(e){
      // Left in the queue for the next attempt. A refused token or a dead engine
      // must not throw the rest away.
      break;
    }
  }
  if(done){ save(); }
  return done;
}

/* ---------- loading ---------- */

async function loadQueue(quiet){
  Q.loading = true; Q.error = '';
  if(!quiet) render();
  try{
    await flushPending();
    const data = await engine('/social/queue', null, 'GET', { retries: 1, timeoutMs: 15000 });
    Q.posts = data.posts || [];
    Q.ventures = data.ventures || [];
    Q.summary = data.summary || [];
    Q.platforms = data.platforms || {};
    Q.categories = data.categories || {};
    Q.vapid = data.vapidPublicKey || null;
    Q.makeReady = Boolean(data.makeReady);
    Q.storage = data.storage !== false;
  }catch(e){
    Q.error = 'Loading the queue failed: ' + (e.message || String(e));
    if(/storage is not connected/i.test(Q.error)) Q.storage = false;
  }
  Q.loading = false; Q.loaded = true;
  render();
}

    <div class="hr"></div>

function qcard(p){
  const limit = platformLimit(p.platform);
  const len = (p.text || '').length;
  const over = len > limit;
  const editing = !!Q.editing[p.id];
  const busy = !!Q.busy[p.id];
  const needsImage = !p.image_url && (
    (Q.platforms[p.platform] && Q.platforms[p.platform].imageRequired) ||
    (Q.categories[p.category] && Q.categories[p.category].needsImage)
  );
  const manual = Q.platforms[p.platform] && Q.platforms[p.platform].automated === false;

  return `<div class="qcard ${busy ? 'gone' : ''}" id="qc-${p.id}" data-id="${p.id}">
    <div class="qhint"><span class="yes">${manual ? 'Copy' : 'Approve'}</span><span class="no">Skip</span></div>
    <div class="qswipe">
      <div class="qmeta">
        <span class="qtag venture">${esc(p.venture)}</span>
        <span class="qtag">${esc(platformLabel(p.platform))}</span>
        <span class="qtag">${esc(categoryLabel(p.category))}</span>
        <span class="qtag count ${over ? 'over' : ''}">${len}/${limit}</span>
        ${p.status !== 'queued' ? `<span class="qtag state ${esc(p.status)}">${esc(p.status)}</span>` : ''}
      </div>

      ${p.image_url ? `<img class="qimg" src="${esc(p.image_url)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
      ${needsImage ? `<div class="qnote">This one needs an image before it can be sent.</div>` : ''}

      ${editing
        ? `<textarea id="qt-${p.id}" oninput="qCount('${p.id}')">${esc(p.text)}</textarea>
           <div class="tiny" id="qn-${p.id}" style="margin:6px 0 10px">${len} of ${limit} characters</div>`
        : `<div class="qtext">${esc(p.text)}</div>`}

      ${p.notes ? `<div class="qnote">${esc(p.notes)}</div>` : ''}
      ${p.error ? `<div class="qerr">${esc(p.error)}</div>` : ''}
      ${p.scheduled_for ? `<div class="tiny" style="margin-bottom:8px">Scheduled for ${esc(new Date(p.scheduled_for).toLocaleString())}</div>` : ''}
      ${p.link ? `<div class="tiny" style="margin-bottom:10px;overflow-wrap:anywhere">Link: ${esc(p.link)}</div>` : ''}

      ${editing
        ? `<div class="qacts">
             <button class="btn jade" onclick="saveText('${p.id}', this)">Save</button>
             <button class="btn ghost" onclick="Q.editing['${p.id}']=false;render()">Cancel</button>
           </div>`
        : `${manual ? `<div class="qnote">${esc(platformLabel(p.platform))} is manual delivery. Copy the text and post it yourself, it is never sent automatically.</div>` : ''}
           <div class="qacts">
             ${manual
               ? `<button class="btn jade" onclick="copyManual('${p.id}')" ${busy ? 'disabled' : ''}>Copy text</button>`
               : `<button class="btn jade" onclick="approve('${p.id}')" ${busy ? 'disabled' : ''}>${p.status === 'failed' ? 'Retry' : 'Approve'}</button>`}
             <span class="spacer"></span>
             <button class="btn danger" onclick="rejectPost('${p.id}')" ${busy ? 'disabled' : ''}>Skip</button>
           </div>
           <div class="qmore">
             <button class="btn ghost" onclick="Q.editing['${p.id}']=true;render()">Edit</button>
             ${manual ? '' : `<button class="btn ghost" onclick="openSchedule('${p.id}')">Schedule</button>`}
             <button class="btn ghost" onclick="openImage('${p.id}')">Image</button>
           </div>`}
    </div>
  </div>`;
}

function qCount(id){
  const ta = document.getElementById('qt-' + id);
  const out = document.getElementById('qn-' + id);
  if(!ta || !out) return;
  const post = Q.posts.find(p => p.id === id);
  const limit = platformLimit(post ? post.platform : '');
  out.textContent = ta.value.length + ' of ' + limit + ' characters';
  out.style.color = ta.value.length > limit ? 'var(--rust)' : '';
}

/* ---------- the toast, and undo ---------- */

let UNDO = null;
let TOAST_TIMER = null;

function toast(message, undoLabel, undoFn){
  const el = document.getElementById('toast');
  if(!el) return;
  UNDO = undoFn || null;
  el.innerHTML = `<span>${esc(message)}</span>` + (undoFn ? `<button onclick="runUndo()">${esc(undoLabel || 'Undo')}</button>` : '');
  el.classList.add('show');
  if(TOAST_TIMER) clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(hideToast, undoFn ? 7000 : 3200);
}
function hideToast(){
  const el = document.getElementById('toast');
  if(el) el.classList.remove('show');
  UNDO = null;
}
function runUndo(){
  const fn = UNDO;
  hideToast();
  if(fn) fn();
}

/* ---------- actions ---------- */

async function copyManual(id){
  const post = Q.posts.find(p => p.id === id);
  if(!post) return;
  try{
    await navigator.clipboard.writeText(post.text);
    toast(platformLabel(post.platform) + ' copied. Paste it there yourself, it is never sent automatically.');
  }catch(e){
    toast('Could not copy. Select the text by hand.');
  }
}

async function approve(id){
  const post = Q.posts.find(p => p.id === id);
  if(!post) return;
  if(!navigator.onLine){
    queueOffline('/social/approve', { id });
    Q.posts = Q.posts.filter(p => p.id !== id);
    render();
    toast('Held until the signal returns.');
    return;
  }
  Q.busy[id] = true; render();
  try{
    await engine('/social/approve', { id });
    Q.posts = Q.posts.filter(p => p.id !== id);
    toast('Sent to ' + platformLabel(post.platform) + '.');
  }catch(e){
    // The reason comes back from the engine and is worth reading, so it is put on
    // the card rather than flashed past in a toast.
    post.status = 'failed';
    post.error = e.message || String(e);
    toast('That one did not go.');
  }
  delete Q.busy[id];
  render();
}

// The queue's reject. Named skip in the API for historical reasons; it is a
// rejection and now carries a reason like every other one.
function rejectPost(id){
  const post = Q.posts.find(p => p.id === id);
  rejectWithReason({
    title: 'Skip this post',
    itemKind: 'social_post',
    itemId: id,
    venture: post && post.venture,
    category: post && post.category,
    onConfirm: (reason) => skip(id, reason)
  });
}

function rejectDocket(id){
  const d = S.docket.find(x => x.id === id);
  rejectWithReason({
    title: 'Reject this work',
    itemKind: 'docket_item',
    itemId: id,
    persona: d && d.charId,
    venture: d && d.biz,
    onConfirm: () => { setStatus(id, 'rejected'); }
  });
}

async function skip(id, reason){
  const post = Q.posts.find(p => p.id === id);
  if(!post) return;
  const restore = Object.assign({}, post);
  if(!navigator.onLine){
    queueOffline('/social/skip', { id, reason: reason || '' });
    Q.posts = Q.posts.filter(p => p.id !== id);
    render();
    toast('Skipped, and held until the signal returns.');
    return;
  }
  Q.busy[id] = true; render();
  try{
    await engine('/social/skip', { id, reason: reason || '' });
    Q.posts = Q.posts.filter(p => p.id !== id);
    delete Q.busy[id];
    render();
    // A skip is a real signal to generation, so undo has to undo it there too.
    toast('Skipped. It counts against that category.', 'Undo', async () => {
      try{
        await engine('/social/unskip', { id });
        Q.posts.unshift(restore);
        render();
        toast('Back in the queue.');
      }catch(e){ toast(errMsg('Putting that post back', e)); }
    });
  }catch(e){
    delete Q.busy[id];
    post.error = e.message || String(e);
    render();
    toast('Could not skip that one.');
  }
}

async function approveAll(){
  if(!Q.posts.length) return;
  const count = Q.posts.length;
  if(!confirm('Send all ' + count + (count === 1 ? ' post' : ' posts') + ' now?')) return;
  if(!navigator.onLine){
    for(const p of Q.posts) queueOffline('/social/approve', { id: p.id });
    Q.posts = [];
    render();
    toast('All held until the signal returns.');
    return;
  }
  Q.loading = true; render();
  try{
    const out = await engine('/social/approve-all', {});
    toast(out.sent + ' sent' + (out.failed ? ', ' + out.failed + ' did not go' : '') + (out.remaining ? ', ' + out.remaining + ' still waiting' : '') + '.');
  }catch(e){
    toast(errMsg('Sending them all', e));

/* ---------- swipe, with an undo behind it ---------- */
/* Right approves, left skips, and neither fires until the card has travelled far
   enough that it cannot be a scroll. Vertical movement wins early, so the list
   still scrolls normally under a thumb. */

const SWIPE_TRIGGER = 96;

function bindSwipe(){
  const list = document.querySelector('.qlist');
  if(!list || list.dataset.swipe === 'on') return;
  list.dataset.swipe = 'on';

  let card = null, layer = null, id = null;
  let startX = 0, startY = 0, dx = 0, decided = '';

  list.addEventListener('touchstart', (e) => {
    const target = e.target.closest('.qcard');
    // Not while editing, and never when the touch began on a control.
    if(!target || e.target.closest('button, textarea, input, a')) return;
    card = target; layer = card.querySelector('.qswipe'); id = card.dataset.id;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    dx = 0; decided = '';
  }, { passive: true });

  list.addEventListener('touchmove', (e) => {
    if(!card) return;
    const x = e.touches[0].clientX - startX;
    const y = e.touches[0].clientY - startY;
    if(!decided){
      if(Math.abs(y) > 12 && Math.abs(y) > Math.abs(x)){ decided = 'scroll'; card = null; return; }
      if(Math.abs(x) > 12){ decided = 'swipe'; card.classList.add('dragging'); }
    }
    if(decided !== 'swipe') return;
    dx = x;
    layer.style.transform = 'translateX(' + dx + 'px)';
  }, { passive: true });

  const release = () => {
    if(!card) return;
    const settled = card, settledId = id, settledLayer = layer, travelled = dx;
    settled.classList.remove('dragging');
    settledLayer.style.transform = '';
    card = null; layer = null; id = null; dx = 0; decided = '';
    if(travelled > SWIPE_TRIGGER){
      const post = Q.posts.find(p => p.id === settledId);
      const manual = post && Q.platforms[post.platform] && Q.platforms[post.platform].automated === false;
      if(manual) copyManual(settledId); else approve(settledId);
    }
    // The swipe is the main way this is used one handed, so it asks for the
    // reason like every other reject rather than being the one route that
    // silently skips the question.
    else if(travelled < -SWIPE_TRIGGER) rejectPost(settledId);
  };

  list.addEventListener('touchend', release, { passive: true });
  list.addEventListener('touchcancel', release, { passive: true });
}

/* ---------- notifications ---------- */

function urlB64ToUint8Array(base64){
  const padded = (base64 + '='.repeat((4 - base64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(padded);
  const out = new Uint8Array(raw.length);
  for(let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

async function enablePush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    toast('This browser cannot do notifications. The engine will fall back to email.');
    return;
  }
  if(!Q.vapid){
    toast('The Worker has no notification keys yet. See the README, step four.');
    return;
  }
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      toast('Notifications declined. The engine will fall back to email.');
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    const sub = existing || await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8Array(Q.vapid)
    });
    const json = sub.toJSON();
    await engine('/social/push/subscribe', { endpoint: json.endpoint, keys: json.keys });
    toast('Notifications on. You will be told when the batch lands.');
  }catch(e){
    toast('Could not turn notifications on: ' + (e.message || e));
  }
}

  }catch(e){ toast(errMsg('Sending the test notification', e)); }
}

/* ---------- boot ---------- */

// Whether this load was already under a service worker's control before any
// of the code below runs. True on every open after the first: false only on
// the very first visit, or one where the browser bypassed the worker
// entirely (a hard refresh). That distinction is what tells an ordinary
// first install apart from a deploy landing while the tab is open, further
// down where SW_RELOAD_PENDING is decided.
const SW_SUPPORTED = 'serviceWorker' in navigator;
const HAD_SW_CONTROLLER_AT_LOAD = SW_SUPPORTED && Boolean(navigator.serviceWorker.controller);
let SW_REG = null;
let SW_RELOAD_PENDING = false;

if(SW_SUPPORTED){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      SW_REG = reg;
      // The update check the focus handler and the refresh button both use,
      // run once more here too, so a launch on its own (not only a later
      // backgrounding and refocusing) is enough to catch a deploy that
      // landed while the app was closed.
      checkForUpdate(false);
    }).catch(() => {
      // No offline shell and no notifications, and nothing else is affected.
    });
  });

  // sw.js activates a new version the moment it finishes installing (see its
  // own skipWaiting call) and takes over every open tab, but a tab that was
  // already loaded keeps running the JS it started with until it reloads.
  // This is what actually closes that gap: the moment a new worker takes
  // over an ALREADY CONTROLLED tab, reload it once, with a brief toast so it
  // does not just vanish. On the very first install there is no controller
  // yet to replace, nothing on the page is stale, and this does nothing.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!HAD_SW_CONTROLLER_AT_LOAD || SW_RELOAD_PENDING) return;
    SW_RELOAD_PENDING = true;
    toast('Updated. Reloading…');
    setTimeout(() => location.reload(), 600);
  });
}

// Asks the browser to re-fetch sw.js right now instead of waiting for its own
// schedule. If the bytes differ, the new worker installs, activates and
// claims every open tab on its own (see sw.js); the controllerchange
// listener above is what notices that happened and reloads. This only ever
// has something to announce itself when nothing changed.
async function checkForUpdate(announceIfCurrent){
  if(!SW_REG) return;
  try{
    await SW_REG.update();
  }catch(e){ return; }
  if(SW_REG.installing || SW_REG.waiting) return;
  if(announceIfCurrent) toast('Already on the latest version.');
}

// The one refresh control, present on every tab: re-fetches whatever the
// current tab is showing, then checks for a newer deploy the same way the
// focus check below does.
async function refreshCurrent(){
  const btn = document.getElementById('refreshfab');
  if(!btn || btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('spinning');
  try{
    if(TAB === 'queue' && engineReady()) await Promise.all([loadQueue(), loadOutreach(true)]);
    else await syncAutopilot();
  }catch(e){ /* the individual loaders already report their own errors */ }
  await checkForUpdate(true);
  btn.disabled = false;
  btn.classList.remove('spinning');
}

// Arriving from the notification, or from the home screen shortcut.
function applyHash(){
  const hash = (location.hash || '').replace('#', '');
  if(hash && TABS.some(t => t.id === hash)){ TAB = hash; return true; }
  return false;
}
window.addEventListener('hashchange', () => { if(applyHash()) render(); });

// The queue is reread when the app comes back to the front, because a post may
// have gone out from another device in the meantime. Every tab, not only the
// queue, also gets a silent check for a newer deploy: this is opened from the
// home screen most mornings, and this is what lets that catch up without
// ever visiting Settings or clearing anything by hand.
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible') return;
  if(TAB === 'queue' && engineReady()) loadQueue(true);
  checkForUpdate(false);
});
window.addEventListener('online', async () => {
  const sent = await flushPending();
  if(sent) toast(sent + (sent === 1 ? ' action' : ' actions') + ' sent now the signal is back.');
  if(TAB === 'queue') loadQueue(true);
});
window.addEventListener('offline', () => { if(TAB === 'queue') render(); });

// Land on the tab the notification or the shortcut asked for, once signed in.
applyHash();
// Renders the login screen immediately (nothing to wait on for that), then
// resolves whether the token already in localStorage is still valid;
// loadQueue only ever fires once that answer is known.
render();
checkSession();
</script>
</body>
</html>
