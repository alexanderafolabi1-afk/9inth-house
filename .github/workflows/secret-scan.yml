name: Secret scan

on:
  push:
  pull_request:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan client-side files for credential shapes
        run: node scripts/check-secrets.mjs
