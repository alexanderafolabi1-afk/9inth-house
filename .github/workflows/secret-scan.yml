name: Checks

on:
  push:
  pull_request:

jobs:
  # Job name kept as it was. It is the one anything referencing a required
  # check would be pointed at, and renaming it would quietly stop that check
  # being required rather than loudly failing.
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan client-side files for credential shapes
        run: node scripts/check-secrets.mjs

  # The engine's own suite. It was written to be run and then only ever run by
  # hand, which meant it proved something about the machine it was typed on
  # rather than about the branch. It needs no network, no Cloudflare and no
  # database, so there is nothing to arrange here beyond calling it.
  check-social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the distribution engine
        run: node scripts/check-social.mjs
